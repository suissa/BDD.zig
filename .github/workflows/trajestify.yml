name: Trajestify DSL and TypeScript runtime

on:
  push:
    branches: [main, "feat/trajestify-dsl-ts-runtime"]
    paths:
      - "packages/trajestify/**"
      - "examples/**"
      - "docs/Trajestify/**"
      - ".github/workflows/trajestify.yml"
  pull_request:
    paths:
      - "packages/trajestify/**"
      - "examples/**"
      - "docs/Trajestify/**"
      - ".github/workflows/trajestify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trajestify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Install package dependencies
        working-directory: packages/trajestify
        run: npm install --no-package-lock --ignore-scripts
      - name: Build TypeScript runtime and run DSL/trajectory tests
        working-directory: packages/trajestify
        run: npm test
      - name: Generate and validate diagnostic artifact
        working-directory: packages/trajestify
        run: |
          mkdir -p ../../artifacts
          node --input-type=module <<'NODE'
          import { defineIntent, Given, When, Then, And, expectValue, runTrajectory, parseTrajestify, compileToIR } from './dist/index.js';
          import { readFile, writeFile } from 'node:fs/promises';
          const dsl = await readFile('../../examples/buy-product.traj', 'utf8');
          const ir = compileToIR(parseTrajestify(dsl, 'examples/buy-product.traj'));
          await writeFile('../../artifacts/trajestify-ir.json', JSON.stringify(ir, null, 2));
          const context = { stock: 10, delivery: false };
          const intent = defineIntent('buy_product', 'Buy product', [
            Given('customer', 'Customer active', () => true),
            When('sales', 'Sale persisted', () => true),
            And('when', 'financial', 'Financial transaction recorded', () => true),
            Then('stock', 'Stock equals 8', c => { c.stock = 9; return expectValue(8, c.stock); }),
            And('then', 'delivery', 'Delivery stage captured', c => { c.delivery = true; return true; }),
          ]);
          const artifact = await runTrajectory(intent, context, { runId: 'ci-stock-divergence' });
          if (artifact.firstDivergence?.sequence !== 4 || artifact.firstDivergence.expected !== 8 || artifact.firstDivergence.observed !== 9 || artifact.steps.length !== 5 || artifact.steps[4]?.clauseId !== 'delivery') {
            throw new Error('Expected stock divergence with complete five-step trajectory');
          }
          await writeFile('../../artifacts/trajestify-stock-divergence.json', JSON.stringify(artifact, null, 2));
          NODE
      - name: Validate TypeScript IR and runtime artifact with Zig adapter
        working-directory: packages/trajestify
        run: |
          zig run ../../src/trajestify_validate.zig -- ir ../../artifacts/trajestify-ir.json
          zig run ../../src/trajestify_validate.zig -- artifact ../../artifacts/trajestify-stock-divergence.json
      - name: Upload Trajectory Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trajestify-stock-divergence
          path: |
            artifacts/trajestify-stock-divergence.json
            artifacts/trajestify-ir.json
          if-no-files-found: error
          retention-days: 30
