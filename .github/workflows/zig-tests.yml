name: Zig tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Run native Zig test suite
        run: zig build test
      - name: Export operator matrix from Zig classifier
        run: zig run tools/export_operator_matrix.zig
      - name: Run JavaScript semantic reference tests
        run: node --test tests/operator-reference.test.mjs
