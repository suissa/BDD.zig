name: Zig tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Run native Zig test suite
        run: zig build test
      - name: Export operator matrix from Zig classifier
        run: zig run src/export_operator_matrix.zig
      - name: Run JavaScript semantic reference tests
        run: node --test tests/operator-reference.test.mjs
      - name: Export canonical concrete semantic cases from Zig
        run: zig run src/export_semantic_cases.zig
      - name: Run concrete value partition tests
        run: node --test tests/concrete-semantic-reference.test.mjs
      - name: Verify divergence replay utility
        run: node tests/replay-semantic-divergences.mjs tests/fixtures/semantic-divergence-example.json
      - name: Run promoted semantic regression corpus
        run: node --test tests/semantic-regression-reference.test.mjs
      - name: Verify divergence promotion and promoted regression
        run: |
          node tests/promote-semantic-divergences.mjs tests/fixtures/semantic-divergence-example.json /tmp/semantic-regressions-smoke.json
          node --test tests/semantic-regression-reference.test.mjs /tmp/semantic-regressions-smoke.json
      - name: Upload semantic divergence report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-divergence-report
          path: tests/semantic-divergences.json
          if-no-files-found: ignore
